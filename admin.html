<!-- Admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Results & Management</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 800px; margin: auto; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn-print { background: #28a745; color: white; border: none; cursor: pointer; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
    <div class="container">
    <div class="form-container"><body>

        <h2>Add New Question</h2>
        <input type="text" id="question" placeholder="Enter Question">
        <input type="text" id="optA" placeholder="Option A">
        <input type="text" id="optB" placeholder="Option B">
        <input type="text" id="optC" placeholder="Option C">
        <input type="text" id="optD" placeholder="Option D">
        <input type="text" id="correct" placeholder="Correct Answer (Exactly as typed in option)">
        <button onclick="saveQuestion()">Save Question</button>
        <button onclick="window.location.href='index.html'" style="background:#28a745">Go to Quiz</button>
    </div>
</div>
    <script>
        function saveQuestion() {
            const q = {
                question: document.getElementById('question').value,
                options: [
                    document.getElementById('optA').value,
                    document.getElementById('optB').value,
                    document.getElementById('optC').value,
                    document.getElementById('optD').value
                ],
                answer: document.getElementById('correct').value
            };
            let quizData = JSON.parse(localStorage.getItem('quizData')) || [];
            quizData.push(q);
            localStorage.setItem('quizData', JSON.stringify(quizData));
            alert("Question Added!");
            location.reload();
        }
    </script>

    <!-- Registration Section -->
    <div class="container no-print">
        <h2>Register New Student</h2>
        <input type="text" id="studentName" placeholder="Full Name">
        <input type="text" id="studentClass" placeholder="Class (e.g. SS3)">
        <input type="text" id="studentCode" placeholder="Unique Code">
        <button onclick="registerStudent()" style="background:#6f42c1; color:white;">Register Student</button>
    </div>

    <!-- Results Table -->
    <div class="container">
         <h2>Examination Results</h2>
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Class</th>
                    <th>Code</th>
                    <th>Score</th>
                    <th>Date</th>
                    <th class="no-print">Action</th>
                </tr>
            </thead>
            <tbody id="resultsBody">
                <!-- Data will appear here -->
            </tbody>
        </table>
        <button class="btn-print no-print" onclick="window.print()" style="margin-top:20px;">Print All Results</button>
    </div>

    <script>
        function registerStudent() {
            const name = document.getElementById('studentName').value;
            const sClass = document.getElementById('studentClass').value;
            const code = document.getElementById('studentCode').value;
            if(!name || !code) return alert("Please fill all fields");

            let students = JSON.parse(localStorage.getItem('students')) || [];
            students.push({ name, class: sClass, code: code });
            localStorage.setItem('students', JSON.stringify(students));
            alert("Student Registered!");
            location.reload();
        }

        // FIX: Ensuring data loads when the page opens
        document.addEventListener("DOMContentLoaded", function() {
            const results = JSON.parse(localStorage.getItem('quizResults')) || [];
            const tableBody = document.getElementById('resultsBody');
            
            if(results.length === 0) {
                tableBody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>No results found yet.</td></tr>";
                return;
            }

            tableBody.innerHTML = ""; // Clear "Loading" text
            results.forEach((res, index) => {
                let row = `<tr>
                    <td>${res.name}</td>
                    <td>${res.class}</td>
                    <td>${res.code}</td>
                    <td><b>${res.score} / ${res.total}</b></td>
                    <td>${res.date}</td>
                    <td class="no-print">
                        <button onclick="printSlip(${index})" style="background:#17a2b8; color:white; padding:5px; border:none; cursor:pointer;">Print Slip</button>
                    </td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        });

        function printSlip(index) {
            const results = JSON.parse(localStorage.getItem('quizResults'));
            const res = results[index];
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <body style="font-family: Arial; padding: 40px; border: 5px double #000;">
                    <h1 style="text-align:center;">EXAMINATION RESULT SLIP</h1>
                    <hr>
                    <p><b>STUDENT NAME:</b> ${res.name.toUpperCase()}</p>
                    <p><b>CLASS:</b> ${res.class}</p>
                    <p><b>EXAM CODE:</b> ${res.code}</p>
                    <p><b>DATE TAKEN:</b> ${res.date}</p>
                    <div style="background:#f4f4f4; padding:20px; text-align:center; border:1px solid #000;">
                        <h2 style="margin:0;">SCORE: ${res.score} / ${res.total}</h2>
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }
    </script>
</body>
</html>
